server {
    listen 80;
    server_name 143.110.209.50;

    # Keep the HTTP challenge reachable for certificate renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://143.110.209.50$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 143.110.209.50;

    # Certbot updates these paths when it renews the certificate.
    ssl_certificate /etc/letsencrypt/live/badminton-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badminton-ip/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
