services:
  app:
    build: .
    # Publish the development app on the host's loopback interface.
    ports:
      - "127.0.0.1:3000:3000"
    # Connect to PostgreSQL over the Compose network using the db service name.
    environment:
      PORT: 3000
      DO_API_TOKEN: "${DO_API_TOKEN:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PGHOST: db
      PGPORT: 5432
      PGUSER: badminton
      PGPASSWORD: local-development-only
      PGDATABASE: badminton_ranked
    # Start the app once the database readiness check passes.
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: badminton_ranked
      INITIAL_INVITE_CODE: "${INITIAL_INVITE_CODE:?Set INITIAL_INVITE_CODE in .env}"
    # Keep data across container restarts and initialize the schema when the database volume is empty.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # Use PostgreSQL's readiness probe to gate app startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton -d badminton_ranked"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
