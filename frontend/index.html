<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badminton Ranked</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
    crossorigin="anonymous"
  >

  <script src="/registration.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <header class="text-center mb-4">
          <h1 class="fw-bold text-success">Badminton Ranked</h1>
          <p class="text-body-secondary">
            Find balanced doubles games at your weekly drop-in.
          </p>
        </header>

        <section
          class="card border-0 shadow-sm mb-4"
          aria-labelledby="player-heading"
        >
          <div class="card-body p-4">
            <h2 id="player-heading" class="h4 mb-4">
              Create a player
            </h2>

            <form id="player-form">
              <div class="mb-4">
                <label for="display-name" class="form-label">
                  Display name
                </label>
                <input
                  id="display-name"
                  name="display_name"
                  type="text"
                  class="form-control"
                  maxlength="100"
                  required
                >
              </div>

              <fieldset class="mb-4">
                <legend class="fs-6">Choose your starting rank</legend>

                <div class="d-flex flex-wrap gap-2">
                  <input
                    id="rank-bronze"
                    class="btn-check"
                    type="radio"
                    name="starting_rank"
                    value="bronze"
                    required
                  >
                  <label
                    for="rank-bronze"
                    class="btn btn-outline-secondary flex-fill"
                  >
                    Bronze — 200
                  </label>

                  <input
                    id="rank-silver"
                    class="btn-check"
                    type="radio"
                    name="starting_rank"
                    value="silver"
                  >
                  <label
                    for="rank-silver"
                    class="btn btn-outline-secondary flex-fill"
                  >
                    Silver — 400
                  </label>

                  <input
                    id="rank-gold"
                    class="btn-check"
                    type="radio"
                    name="starting_rank"
                    value="gold"
                  >
                  <label
                    for="rank-gold"
                    class="btn btn-outline-secondary flex-fill"
                  >
                    Gold — 600
                  </label>
                </div>
              </fieldset>

              <button
                id="create-player"
                type="submit"
                class="btn btn-success w-100"
                disabled
              >
                Create player
              </button>
            </form>

            <p
              id="player-message"
              class="mt-3 mb-0 text-break"
              role="status"
            ></p>
          </div>
        </section>

        <section
          class="card border-0 shadow-sm"
          aria-labelledby="queue-heading"
        >
          <div class="card-body p-4">
            <h2 id="queue-heading" class="h4">Join the game</h2>
            <p class="text-body-secondary">
              Queue up to find a doubles match with other players.
            </p>

            <button
              type="button"
              class="btn btn-outline-success w-100"
              disabled
            >
              Solo Queue
            </button>

            <p class="small text-body-secondary mt-3 mb-0">
              Matchmaking is coming soon.
            </p>
          </div>
        </section>

      </div>
    </div>
  </main>
</body>
</html>
