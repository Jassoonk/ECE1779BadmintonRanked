<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match History - Badminton Ranked</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <a href="/" class="btn btn-outline-secondary mb-4">Back to Lobby</a>

    <section class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Match History</h1>
        <p class="text-body-secondary">
          Recent completed doubles matches and rating changes.
        </p>
        <div id="match-history" aria-live="polite">
          Loading match history...
        </div>
      </div>
    </section>
  </main>

  <script src="/history.js" defer></script>
</body>
</html>
